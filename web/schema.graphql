	"""
	Follows a show that isn't in the library yet.
	"""
	addSeries(input: NewSeries!): Series!
	"""
	Makes a title in a library a managed show (unmonitored until you say otherwise).
	"""
	manageTitle(titleId: Int!): Series!
	updateSeries(id: Int!, patch: SeriesPatch!): Series!
