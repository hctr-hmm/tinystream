type Mutation {
	"""
	Creates the very first account, which is always an admin, and signs in.
	"""
	setup(username: String!, password: String!): SignedIn!
	signIn(username: String!, password: String!): SignedIn!
	"""
	Ends this session.
	"""
	signOut: Boolean!
	"""
	The first half of signing in with a passkey.
	"""
	startPasskeySignIn(username: String!): PasskeyChallenge!
	"""
	The second half: the browser's answer to the challenge.
	"""
	finishPasskeySignIn(challenge: String!, credential: JSON!): SignedIn!
	changePassword(current: String!, new: String!): Boolean!
	"""
	The first half of adding a passkey to your account.
	"""
	startPasskeyRegistration(name: String): PasskeyChallenge!
	"""
	The second half: the new credential. Returns your passkeys.
	"""
	finishPasskeyRegistration(challenge: String!, credential: JSON!): [Passkey!]!
	"""
	Removes one of your passkeys. Returns your passkeys.
	"""
	deletePasskey(id: Int!): [Passkey!]!
	createUser(input: NewUser!): User!
	updateUser(id: Int!, input: UserPatch!): User!
	"""
	Returns the id of the account that's gone.
	"""
	deleteUser(id: Int!): Int!
	setPermissionDefaults(permissions: PermissionsInput!): Permissions!
	"""
	Sets a picture: yours, or (for admins) someone else's. PNG, JPEG,
	WebP or GIF, up to 512 KB.
	"""
	setAvatar(image: Upload!, userId: Int): User!
	removeAvatar(userId: Int): User!
	"""
	Marks videos watched (or not), as if played to the end (or never started).
	"""
	setWatched(videoIds: [Int!]!, watched: Boolean!): [Video!]!
	"""
	Marks every video of a title watched (or not).
	"""
	setTitleWatched(id: Int!, watched: Boolean!): Title!
	"""
	Where you are in a video, in seconds. It counts as finished once the
	credits roll: the last 8%, or the last 30 seconds.
	"""
	saveProgress(videoId: Int!, position: Float!, duration: Float!): Video!
	"""
	Matches a title to a provider's entry by hand.
	"""
	matchTitle(id: Int!, provider: Provider!, providerId: String!): Title!
	"""
	Fetches a title's details again (or looks it up again, if it's unmatched).
	"""
	refreshTitle(id: Int!): Title!
	"""
	Starts watching a video with others.
	"""
	startRoom(input: NewRoom!): Room!
	"""
	Queues a clip to render.
	"""
	createClip(input: NewClip!): Clip!
	"""
	Takes a screenshot: it's there to show once this answers.
	"""
	takeScreenshot(input: NewScreenshot!): Clip!
	updateClip(id: Int!, input: ClipPatch!): Clip!
	"""
	Returns the id of the clip that's gone.
	"""
	deleteClip(id: Int!): Int!
	"""
	Renders a clip again: one whose render was dropped (anyone who can
	watch it), or one that failed (whoever may manage it).
	"""
	renderClip(id: Int!): Clip!
	"""
	Stops a render.
	"""
	cancelClipRender(id: Int!): Clip!
	"""
	Sends a clip to people.
	"""
	shareClip(id: Int!, users: [Int!]!): Clip!
	"""
	Takes a clip back from someone it was sent to.
	"""
	unshareClip(id: Int!, userId: Int!): Clip!
	"""
	Takes a clip sent to you off your list. Returns its id.
	"""
	hideClip(id: Int!): Int!
	"""
	Drops every render. The clips stay, and render again when opened.
	Returns how many were dropped. Admins only.
	"""
	dropClipRenders: Int!
	"""
	Marks notifications read: just these, or all of them.
	"""
	markNotificationsRead(ids: [Int!]): Inbox!
	"""
	Deletes one notification, or all of them.
	"""
	deleteNotifications(id: Int): Inbox!
	"""
	Replaces whole sections of config.toml; the rest stay as they are.
	"""
	updateSettings(patch: ConfigPatch!): Settings!
	"""
	Replaces config.toml with `text`, if it's valid.
	"""
	replaceConfig(text: String!): Settings!
	addLibrary(input: LibraryInput!): Settings!
	"""
	Changes the library called `name`. Renaming it keeps its titles and
	who may see it.
	"""
