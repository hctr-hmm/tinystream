	label: String
	"""
	The episode's title.
	"""
	name: String
	overview: String
	"""
	Its own artwork, the provider's, or a frame taken from the video.
	"""
	still: String!
	airDate: String
	"""
	Seconds.
	"""
	duration: Float
	"""
	Where you left off, in seconds. Rooms decide this for themselves.
