type SeriesChanged {
	seriesId: Int!
}

type SeriesEpisode {
	season: Int!
	episode: Int!
	"""
	Its number counting from the first episode, for shows numbered that way.
	"""
	absolute: Int
	name: String
	airAt: Int
	aired: Boolean!
	state: EpisodeState!
	attempts: Int!
	searchedAt: Int
	nextSearch: Int
	downloadId: Int
	"""
	The file in the library, when there is one.
	"""
	video: Video
}

"""
Changes to a managed show. Left out stays as it is; null clears it.
"""
input SeriesPatch {
	monitor: Monitor
	profile: String
	sources: [String!]
	groups: [String!]
	aliases: [String!]
	numbering: Numbering
	naming: String
	seeding: SeedingInput
}

type Server {
	"""
	Nobody has an account yet: the first one made is the admin.
	"""
	setupRequired: Boolean!
	version: String!
	"""
	Whether clipping is turned on.
	"""
	clips: Boolean!
	"""
	Whether this build downloads (and manages shows).
	"""
	downloads: Boolean!
	"""
	Sources that are turned on.
	"""
	sources: Int!
	transcoding: Transcoding!
}

type ServerPaths {
	config: String!
	data: String!
	log: String!
}

type Settings {
	network: NetworkConfig!
	log: LogConfig!
	scan: ScanConfig!
	metadata: MetadataConfig!
	transcode: TranscodeConfig!
	clips: ClipsConfig!
	downloads: DownloadsConfig!
	automation: AutomationConfig!
	requests: RequestsConfig!
	sources: [Source!]!
	profiles: [Profile!]!
	libraries: [ConfiguredLibrary!]!
	"""
	config.toml, as written.
	"""
	raw: String!
	"""
	Why the last change to config.toml wasn't applied.
	"""
	error: String
	paths: ServerPaths!
}

type Shelf {
	library: String!
	titles: [Title!]!
}

type SignedIn {
	user: User!
	"""
	For clients that don't keep cookies: send it as `Authorization: Bearer <token>`.
	"""
	token: String!
}

type Similar {
	"""
	What the provider recommends alongside the title.
	"""
	recommendations: [DiscoverResult!]!
	"""
	What else the people here who watched it have been watching.
	"""
	alsoWatched: [Title!]!
}

type SkippedFile {
	library: String!
	path: String!
	reason: String!
}

"""
Somewhere releases come from. tinystream ships with none.
"""
type Source {
	name: String!
	kind: SourceKind!
	"""
	Torznab: the API endpoint. RSS: the search URL, with `{query}`.
	"""
	url: String!
	"""
	RSS: the feed of new releases, checked regularly. Defaults to the
	search URL with an empty query.
	"""
	feed: String
	apiKey: String
	"""
	Torznab categories to search, e.g. [5070] for anime.
	"""
	categories: [Int!]!
	enabled: Boolean!
	downloadPath: String
	"""
	Overrides [downloads.seeding] for torrents from here (private
	trackers usually have their own rules).
	"""
	seeding: Seeding
}

"""
Somewhere releases come from. tinystream ships with none.
"""
input SourceInput {
	name: String!
	kind: SourceKind!
	"""
	Torznab: the API endpoint. RSS: the search URL, with `{query}`.
	"""
	url: String!
	"""
	RSS: the feed of new releases, checked regularly. Defaults to the
	search URL with an empty query.
	"""
	feed: String
	apiKey: String
	"""
	Torznab categories to search, e.g. [5070] for anime.
	"""
	categories: [Int!]!
	enabled: Boolean! = true
	downloadPath: String
	"""
	Overrides [downloads.seeding] for torrents from here (private
	trackers usually have their own rules).
	"""
	seeding: SeedingInput
}

enum SourceKind {
	"""
	A Torznab API (many trackers speak it natively).
	"""
	TORZNAB
	"""
	An RSS feed with a search URL, `{query}` marking where the search goes.
	"""
	RSS
}

"""
Whether the video a clip was cut from is still there, and still the same.
"""
enum SourceStatus {
	OK
	CHANGED
	GONE
}

type Subscription {
	"""
	Everything that happens on the server that you should hear about.
	"""
	events: Event!
}

type SubtitleTrack {
	"""
	`s<stream index>` for embedded tracks, `x<n>` for files next to the video.
	"""
	id: String!
	codec: String!
	language: String
	title: String
	default: Boolean!
	forced: Boolean!
	"""
	Image subtitles (PGS, VobSub) can't be rendered in the browser yet.
	"""
	supported: Boolean!
}

type Title {
	id: Int!
	kind: TitleKind!
	"""
	The library it's in.
	"""
	library: String!
	name: String!
	year: Int
	"""
	Your own artwork next to the files first, then the provider's.
	"""
	poster: String
	backdrop: String
	overview: String
	genres: [String!]!
	"""
	Out of 10.
	"""
	rating: Float
	"""
	Where it is on disk; only admins see this.
	"""
	path: String
	matchState: MatchState!
	"""
	Where its details come from.
	"""
	provider: Provider
	"""
	Its id at the provider.
	"""
	providerId: String
	"""
	Where its library looks for details.
	"""
	libraryProvider: Provider
	"""
	Videos (episodes, or 1 for a movie) you've finished.
	"""
	watchedCount: Int!
	videoCount: Int!
	"""
	How far (0 to 1) into the video you're in the middle of, if any.
	"""
	progress: Float
	"""
	Unwatched episodes added in the last few days.
	"""
	freshCount: Int!
	"""
	Every video, in order: seasons, then specials.
	"""
	videos: [Video!]!
	"""
	A movie's video.
	"""
	movie: Video
	seasons: [Season!]!
	"""
	What Play does: resume the video in progress, start the one after
	the last finished, or start from the beginning.
	"""
	nextUp: NextUp
	"""
	What the provider recommends alongside it, and what else the people
	here who watched it have been watching.
	"""
	similar: Similar!
	"""
	Search results to match it to: for `query` (its folder name by
	default), at `provider` (its library's by default).
	"""
	matchCandidates(query: String, provider: Provider): MatchCandidates!
	"""
	The managed show behind it, if it's one. People who don't manage
	shows only see what's coming next.
	"""
	series: Series
}

enum TitleKind {
	SHOW
	MOVIE
}

type TorrentFile {
	"""
	Relative to the download's folder.
	"""
	path: String!
	size: Int!
	done: Int!
}

enum TorrentStage {
	CHECKING
	"""
	Fetching the torrent's metadata from peers.
	"""
	METADATA
	DOWNLOADING
	SEEDING
}

"""
A torrent as the engine has it right now.
"""
type TorrentStatus {
	stage: TorrentStage!
	paused: Boolean!
	"""
	0 to 1.
	"""
	progress: Float!
	"""
	Bytes a second.
	"""
	downloadRate: Int!
	uploadRate: Int!
	"""
	Bytes on disk.
	"""
	done: Int!
	uploaded: Int!
	ratio: Float!
	peers: Int!
	seeds: Int!
	seedingSeconds: Int!
	eta: Int
	"""
	The piece map in up to 128 buckets, each 0–255.
	"""
	pieces: [Int!]!
}

"""
Tracks everyone gets unless they pick their own.
"""
input TracksInput {
	audio: Int
	audioLanguage: String
	"""
	Null is off.
	"""
	subtitle: String
	subtitleLanguage: String
}

type TranscodeConfig {
	hardware: Hardware!
	vaapiDevice: String!
}

input TranscodeConfigInput {
	hardware: Hardware!
	vaapiDevice: String!
}

"""
What transcoding can use on this server.
"""
type Transcoding {
	"""
	e.g. "Mesa Gallium driver 25.1 for AMD Radeon RX 7800 XT"
	"""
	vaapi: String
	vaapiError: String
	softwareH264: Boolean!
}

type UndoReport {
	undone: Int!
	problems: [String!]!
}

"""
A multipart file upload
"""
scalar Upload

"""
Someone on this server. Everyone signed in sees who's here; what they may
do is only for them and admins.
"""
type User {
	id: Int!
	username: String!
	isAdmin: Boolean!
	"""
	Their picture; null without one.
	"""
	avatar: String
	"""
	What they can do, with the defaults and their overrides applied.
	"""
	permissions: Permissions!
	"""
	Where they depart from the defaults. Admins only.
	"""
	overrides: PermissionOverrides!
	createdAt: Int!
	"""
	Their most recent activity on any session. Admins only.
	"""
	lastSeen: Int
	"""
	Their own passkeys; only they see these.
	"""
	passkeys: [Passkey!]!
}

"""
Changes to an account; what's left out stays as it is.
"""
input UserPatch {
	username: String
	isAdmin: Boolean
	"""
	Signs them out everywhere (unless it's you).
	"""
	password: String
	"""
	Replaces all of their overrides.
	"""
	permissions: PermissionOverridesInput
}

"""
What a profile makes of a release.
"""
type Verdict {
	accepted: Boolean!
	score: Int!
	"""
	Why it was turned down.
	"""
	rejections: [String!]!
	warnings: [String!]!
}

type Video {
	id: Int!
	"""
	The show (or movie) it belongs to.
