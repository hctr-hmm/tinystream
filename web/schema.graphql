	updateSource(name: String!, input: SourceInput!): Settings!
	removeSource(name: String!): Settings!
	addProfile(input: ProfileInput!): Settings!
	"""
	Changes the profile called `name`; shows using it follow a rename.
	"""
	updateProfile(name: String!, input: ProfileInput!): Settings!
	removeProfile(name: String!): Settings!
	"""
	Looks through every library for badly named files again.
	"""
	refreshRenameSuggestions: Boolean!
	"""
	Carries out rename suggestions (with their subtitles and artwork).
	"""
	applyRenames(ids: [Int!]!): AppliedRenames!
	dismissRenames(ids: [Int!]!): Boolean!
	"""
	Reverses a batch of changes to libraries, newest first.
	"""
	undoFileChanges(batch: String!): UndoReport!
	"""
	Asks for a show to be added (approved right away for some people).
	"""
	createRequest(input: NewRequest!): Request!
	"""
	Approves a request: its show is added (to `library`, if it didn't say).
	"""
	approveRequest(id: Int!, library: String): Request!
	"""
	Declines a request, maybe saying why.
	"""
	declineRequest(id: Int!, note: String): Request!
	"""
